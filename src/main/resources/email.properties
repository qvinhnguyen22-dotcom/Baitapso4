# Cấu hình tài khoản gửi Email (SMTP Gmail)
# Lưu ý: Khi sử dụng Gmail, mail.password phải là MẬT KHẨU ỨNG DỤNG (App Password 16 ký tự),
# KHÔNG PHẢI mật khẩu đăng nhập tài khoản Google thông thường.
# Cách lấy App Password: Google Account -> Security -> 2-Step Verification -> App passwords.

mail.username=your-email@gmail.com
mail.password=your-16-character-app-password
